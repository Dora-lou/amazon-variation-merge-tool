name: Niche and SQR data tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate JavaScript syntax
        run: |
          node --check niche-engine.js
          node --check niche-ui.js
          node --check niche-engine.test.js
          node --check sqr-engine.js
          node --check sqr-ui.js
          node --check sqr-engine.test.js
      - name: Run Niche engine tests
        run: node niche-engine.test.js
      - name: Run SQR engine tests
        run: node sqr-engine.test.js
