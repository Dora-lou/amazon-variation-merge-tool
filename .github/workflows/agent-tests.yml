name: Sales Plan Agent Tests

on:
  push:
    paths:
      - 'agent/**'
      - '.github/workflows/agent-tests.yml'
  pull_request:
    paths:
      - 'agent/**'
      - '.github/workflows/agent-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test localhost Agent without external credentials
        run: python -m unittest discover -s agent -p 'test_*.py' -v
