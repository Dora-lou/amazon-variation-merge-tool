<body><main class="shell">
<header class="workspace-header"><a class="workspace-brand" href="./index.html" aria-label="亚马逊运营工作台首页"><span class="workspace-logo" aria-hidden="true">O</span><span><span class="workspace-name">亚马逊运营工作台</span><span class="workspace-sub">Amazon Operations Workspace</span></span></a><nav class="workspace-nav" aria-label="工具模块">

<section class="workspace-intro"><div class="eyebrow">PRIVATE LOCAL CHAT</div><h1>AI 对话</h1><p>独立的 DeepSeek 多轮对话入口。当前不读取商品库、销售计划、Skills 或任何 MCP 数据。</p></section>
<section class="chat-card" aria-label="AI 对话"><div class="chat-toolbar"><div><strong>DeepSeek 对话</strong><span id="connectionStatus">正在检查本地后端…</span></div><button id="newChat" type="button" class="secondary-button">新建对话</button></div>
<div id="messages" class="messages" aria-live="polite"><div class="empty-state"><span class="empty-icon">✦</span><strong>开始一段新对话</strong><p>你可以连续提问，当前对话会按顺序发送给后端。</p></div></div>
<form id="chatForm" class="composer"><textarea id="prompt" rows="3" maxlength="12000" placeholder="输入消息…（Enter 发送，Shift + Enter 换行）" required></textarea><div class="composer-foot"><span id="errorMessage" class="error" role="alert"></span><button id="sendButton" type="submit" class="send-button">发送 <span>↗</span></button></div></form></section>
<footer class="footer"><span>亚马逊运营工作台 · AI 对话</span><span>API Key 仅由本机后端读取</span></footer>
</main><script src="./ai-chat.js"></script></body></html>
